<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Library</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            background-color: #ffffff; /* Белый фон */
            color: #444;
        }

        /* Шапка с поиском как на рисунке */
        header {
            padding: 15px;
            background-color: #e3f2fd; /* Нежно-голубой */
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }

        .search-bar {
            background: white;
            padding: 10px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            color: #aaa;
        }

        /* Контейнер для категорий */
        .container {
            padding: 20px;
        }

        h2 {
            font-size: 1.2rem;
            text-transform: uppercase;
            color: #555;
            margin-top: 25px;
        }

        /* Лента книг (горизонтальная) */
        .book-row {
            display: flex;
            overflow-x: auto;
            gap: 15px;
            padding: 10px 0;
        }

        .book-card {
            min-width: 100px;
            height: 140px;
            background-color: #fce4ec; /* Нежно-розовый */
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            text-align: center;
            padding: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            border: 1px solid #f8bbd0;
        }

        /* Нижнее меню (как на рисунке) */
        nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            border-top: 1px solid #eee;
        }

        .nav-icon {
            font-size: 1.5rem;
            color: #d4a5b2;
        }
    </style>
</head>
<body>

<header>
    <div class="search-bar">
        🔍 Поиск
    </div>
</header>

<div class="container">
    <h2>Детективы</h2>
    <div class="book-row">
        <div class="book-card">Шерлок Холмс</div>
        <div class="book-card">Убийство в Восточном экспрессе</div>
        <div class="book-card">Черный кот</div>
    </div>

    <h2>Романтика</h2>
    <div class="book-row">
        <div class="book-card">Гордость и предубеждение</div>
        <div class="book-card">Сумерки</div>
        <div class="book-card">Маленькие женщины</div>
    </div>

    <h2>Психология</h2>
    <div class="book-row">
        <div class="book-card">Сила привычки</div>
        <div class="book-card">Тонкое искусство пофигизма</div>
        <div class="book-card">Игры, в которые играют люди</div>
    </div>
</div>

<div style="height: 80px;"></div> <nav>
    <span class="nav-icon">📋</span>
    <span class="nav-icon">🏠</span>
    <span class="nav-icon">⭐</span>
</nav>

</body>
</html>
