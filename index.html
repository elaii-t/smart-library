<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Умная Библиотека</title>
    <style>
        /* 1. ЦВЕТА И ШРИФТЫ */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: #f4f4f9;
            color: #333;
        }

        header {
            background-color: #2c3e50; /* Темный графит */
            color: white;
            padding: 2rem;
            text-align: center;
        }

        /* 2. ШАБЛОН ИНТЕРФЕЙСА */
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .book-card {
            border-left: 5px solid #d4a5b2; /* Акцентный цвет */
            padding: 15px;
            margin-bottom: 15px;
            background: #fffafa;
            transition: 0.3s;
        }

        .book-card:hover {
            transform: translateX(10px);
        }

        button {
            background-color: #d4a5b2;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
        }

        footer {
            text-align: center;
            font-size: 0.8rem;
            margin-top: 50px;
            color: #888;
        }
    </style>
</head>
<body>

<header>
    <h1>Smart Library</h1>
    <p>Твой гид в мире знаний</p>
</header>

<div class="container">
    <h2>Мои книги</h2>
    
    <div class="book-card">
        <h3>Основы дизайна</h3>
        <p>Краткое описание того, как работают цвета и композиция.</p>
        <button>Читать</button>
    </div>

    <div class="book-card">
        <h3>История Бишкека</h3>
        <p>Интересные факты о нашем любимом городе.</p>
        <button>Читать</button>
    </div>

    <div class="book-card">
        <h3>Нейросети в 2026</h3>
        <p>Как ИИ помогает нам учиться и создавать проекты.</p>
        <button>Читать</button>
    </div>
</div>

<footer>
    <p>&copy; 2026 Разработано в Школе №3</p>
</footer>

</body>
</html>
